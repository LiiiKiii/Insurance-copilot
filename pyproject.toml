[project]
name = "insurance-performance-intelligence-copilot"
version = "0.1.0"
description = "Hybrid intelligent reasoning system for insurance performance gap diagnosis and action planning"
requires-python = ">=3.11"
dependencies = [
    "json-repair>=0.57.0,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "openai>=2.8.0",
    "pydantic>=2.12,<3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nanobot*"]